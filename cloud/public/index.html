<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTN Mesh Relay</title>
  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --primary: #1769FF;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .qr-box {
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 24px;
    }
    #qrcode { width: 200px; height: 200px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn:active { opacity: 0.85; }
    .code-box {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .copied { color: #22C55E; font-size: 13px; margin-top: 4px; display: none; }
  </style>
  <!-- The page's URL fragment holds contact keys / a group key: no third-party scripts may run
       here (they could read location.hash), so the QR library is served from this Worker, and
       the CSP blocks everything else. No referrer is sent from this page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <script src="/qrcode.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1 id="title">DTN Mesh Relay</h1>
    <p class="sub" id="subtitle">Peer-to-peer delay-tolerant messaging</p>

    <div class="qr-box" id="qr-container" style="display: none;">
      <div id="qrcode"></div>
    </div>

    <div class="code-box" id="code-display" style="display: none;"></div>

    <button class="btn btn-primary" id="btn-open" style="display: none;">Open in DTN Mesh App</button>
    <button class="btn btn-secondary" id="btn-copy" style="display: none;">Copy Code for App</button>
    <div class="copied" id="copied-msg">✓ Copied to clipboard! Use "Paste link / code" in app.</div>

    <a class="btn btn-secondary" id="btn-download" href="https://github.com">Get DTN Mesh App</a>
  </div>

  <script>
    // Browsers may percent-encode the fragment (spaces, non-ASCII names); a malformed % sequence
    // must not crash the page, so decode once, safely, and use the decoded payload everywhere.
    const safeDecode = (s) => { try { return decodeURIComponent(s); } catch (_) { return s; } };
    const hash = safeDecode(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : '').trim();
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('subtitle');
    const qrContainer = document.getElementById('qr-container');
    const codeDisplay = document.getElementById('code-display');
    const btnOpen = document.getElementById('btn-open');
    const btnCopy = document.getElementById('btn-copy');
    const copiedMsg = document.getElementById('copied-msg');

    if (hash.startsWith('dtnid:') || hash.startsWith('dtngrp:')) {
      qrContainer.style.display = 'inline-block';
      codeDisplay.style.display = 'block';
      codeDisplay.textContent = hash;
      btnOpen.style.display = 'block';
      btnCopy.style.display = 'block';

      if (hash.startsWith('dtnid:')) {
        const parts = hash.split(':');
        const name = parts[parts.length - 1] || 'Contact';
        titleEl.textContent = 'Add ' + name;
        subEl.textContent = 'Scan or open to connect on DTN Mesh';
      } else if (hash.startsWith('dtngrp:')) {
        const parts = hash.split(':');
        const name = parts[2] || 'Group';
        titleEl.textContent = 'Join ' + name;
        subEl.textContent = 'Encrypted group invite';
      }

      new QRCode(document.getElementById("qrcode"), {
        text: hash,
        width: 200,
        height: 200,
        colorDark : "#0F172A",
        colorLight : "#FFFFFF",
        correctLevel : QRCode.CorrectLevel.M
      });

      btnOpen.onclick = () => {
        // Android Chrome Intent syntax
        // Chrome intent URL: intent:<opaque part>#Intent;scheme=<s>;...;end  ->  the app receives
        // "<s>:<opaque part>", i.e. exactly the dtnid:/dtngrp: payload. The opaque part is
        // percent-encoded so a '#' or ';' in a name can't break the intent syntax (the app decodes it).
        const scheme = hash.startsWith('dtnid:') ? 'dtnid' : 'dtngrp';
        const opaque = encodeURIComponent(hash.substring(scheme.length + 1));
        window.location.href = 'intent:' + opaque + '#Intent;scheme=' + scheme + ';package=com.dtn.mesh;end';
      };

      btnCopy.onclick = () => {
        navigator.clipboard.writeText(hash).then(() => {
          copiedMsg.style.display = 'block';
          setTimeout(() => { copiedMsg.style.display = 'none'; }, 3000);
        });
      };
    }
  </script>
</body>
</html>
